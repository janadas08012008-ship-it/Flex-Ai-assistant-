<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flex AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🤖 <span>Flex AI</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="sidebar-bottom">
            <div>⚙️ Settings</div>
            <div>👤 Profile</div>
        </div>

    </aside>


    <!-- MAIN AREA -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">
            <span>Flex AI</span>

            <button class="menu-button" onclick="toggleSidebar()">
                ☰
            </button>
        </header>


        <!-- CHAT AREA -->
        <section class="chat" id="chat">

            <div class="welcome">

                <div class="robot">
                    🤖
                </div>

                <h1>Hello, I'm Flex AI</h1>

                <p>
                    Your intelligent AI assistant.
                </p>

            </div>

        </section>


        <!-- INPUT AREA -->
        <div class="input-container">

            <div class="input-box">

                <button class="icon-button" title="Attach file">
                    +
                </button>

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message Flex AI..."
                    autocomplete="off"
                >

                <button
                    class="send-button"
                    onclick="sendMessage()"
                    title="Send"
                >
                    ↑
                </button>

            </div>

            <p class="disclaimer">
                Flex AI can make mistakes. Check important information.
            </p>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script>

        const input = document.getElementById("messageInput");
        const chat = document.getElementById("chat");


        // Send message when Enter is pressed
        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });


        // Send message
        function sendMessage() {

            const message = input.value.trim();

            if (message === "") {
                return;
            }


            // Remove welcome screen
            const welcome = document.querySelector(".welcome");

            if (welcome) {
                welcome.remove();
            }


            // User message
            const userMessage = document.createElement("div");

            userMessage.className = "message user-message";

            userMessage.innerHTML = `
                <div class="avatar">You</div>
                <div class="message-text">
                    ${escapeHTML(message)}
                </div>
            `;

            chat.appendChild(userMessage);


            // Clear input
            input.value = "";


            // Temporary AI response
            setTimeout(function() {

                const aiMessage = document.createElement("div");

                aiMessage.className = "message ai-message";

                aiMessage.innerHTML = `
                    <div class="avatar ai-avatar">🤖</div>

                    <div class="message-text">
                        Hello! I'm Flex AI 👋<br><br>
                        I received your message:
                        <br>
                        <strong>${escapeHTML(message)}</strong>
                        <br><br>
                        My real AI brain will be connected next.
                    </div>
                `;

                chat.appendChild(aiMessage);

                scrollChat();

            }, 500);


            scrollChat();
        }


        // New chat
        function newChat() {

            chat.innerHTML = `
                <div class="welcome">

                    <div class="robot">
                        🤖
                    </div>

                    <h1>Hello, I'm Flex AI</h1>

                    <p>
                        Your intelligent AI assistant.
                    </p>

                </div>
            `;

        }


        // Mobile sidebar
        function toggleSidebar() {

            document
                .querySelector(".sidebar")
                .classList.toggle("mobile-open");

        }


        // Scroll chat
        function scrollChat() {

            chat.scrollTop = chat.scrollHeight;

        }


        // Prevent HTML injection
        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }

    </script>

</body>

</html>
